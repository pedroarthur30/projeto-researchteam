[project]
name = "projeto-researchteam"
version = "0.2.0"
description = "Pipeline Corporativo de Inteligência Competitiva com Agentic RAG, FastAPI e LangChain LCEL."
readme = "README.md"
authors = [
    { name = "Pedro Arthur Brandão da Guia", email = "pedroarthurb98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
projeto-researchteam = "projeto_researchteam.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"